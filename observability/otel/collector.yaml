# OpenTelemetry Collector (contrib) — Yii3 Enterprise Platform. Author: ShokirjonMK
#
# App (OTEL_ENABLED=true, OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318) -> OTLP -> this collector
#   -> memory_limiter -> attribute scrubbing (no credentials / cookies leave the collector) -> batch -> Jaeger (OTLP)
# In Kubernetes run the same config as a Deployment in namespace "observability" (port 4317/4318) and point
# the exporter at your tracing backend (Jaeger / Tempo / vendor OTLP endpoint).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Defence in depth: the app's Redactor already strips secrets; never forward auth material even if a span has it.
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: http.request.header.x-api-key, action: delete }
      - { key: http.request.header.proxy-authorization, action: delete }
      - { key: http.authorization, action: delete }
      - { key: http.cookie, action: delete }
      - { key: db.statement.parameters, action: delete }
      - { key: enduser.credential, action: delete }
      # Query strings may carry tokens (?token=, ?code=): keep only the path
      - { key: url.query, action: delete }

  resource:
    attributes:
      - { key: deployment.environment.name, value: local, action: upsert }
      - { key: service.namespace, value: yii3-enterprise-platform, action: upsert }

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, resource, batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, resource, batch]
      exporters: [debug]
