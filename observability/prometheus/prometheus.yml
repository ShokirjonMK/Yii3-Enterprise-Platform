# Yii3 Enterprise Platform — Prometheus (docker compose "monitoring" profile).
# Author: ShokirjonMK — https://github.com/ShokirjonMK/Yii3-Enterprise-Platform
#
# Kubernetes uses prometheus-operator objects instead (infra/kubernetes/base/monitoring/scrape.yaml); the rule
# files below are shared by both (load them via a PrometheusRule or the kube-prometheus-stack additionalRuleFiles).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    platform: yii3-enterprise-platform
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Application metrics through nginx. Counters/histograms are aggregated in Redis across all PHP processes,
  # so a single target represents the whole application (never scrape individual php-fpm containers).
  # The bearer token is written to runtime/metrics-token (gitignored) by `scripts/platform.sh metrics-token`
  # from METRICS_TOKEN in .env and mounted read-only — it never lives in this file or in git.
  - job_name: platform-app
    metrics_path: /metrics
    scrape_interval: 30s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/metrics-token
    static_configs:
      - targets: ["nginx:8080"]
        labels:
          instance: platform-web

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { instance: postgres }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { instance: redis }

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels: { instance: kafka }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
