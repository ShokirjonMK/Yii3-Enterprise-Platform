# Redis 7.4 — "cache" instance (local development): PSR-16 application cache only (REDIS_CACHE_HOST=redis-cache).
# Everything here can be recomputed from PostgreSQL, so it evicts the least frequently used keys when full and keeps
# no persistence (a restart = a cold cache, never data loss). The platform is fail-open on this instance.
bind 0.0.0.0
protected-mode yes

maxmemory 256mb
maxmemory-policy allkeys-lfu
maxmemory-samples 10

# no persistence: a cache does not need to survive restarts
appendonly no
save ""

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

tcp-keepalive 60
timeout 0
maxclients 10000

latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
