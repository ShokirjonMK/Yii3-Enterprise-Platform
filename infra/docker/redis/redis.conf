# Redis 7.4 — local development. Redis is a cache/coordination layer, never the system of record.
bind 0.0.0.0
protected-mode yes
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec
save 900 1
latency-monitor-threshold 100
slowlog-log-slower-than 10000
rename-command FLUSHALL ""
rename-command DEBUG ""
