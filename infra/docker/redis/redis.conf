# Redis 7.4 — "state" instance (local development): PHP sessions, distributed locks, rate limits, one-time codes,
# config revision. Never the system of record, but its keys must NOT be evicted: with an LRU/LFU policy a full
# instance silently deletes sessions (users are signed out "too early"), locks and OTP codes.
# The evictable application cache lives in the separate "redis-cache" instance (redis-cache.conf, REDIS_CACHE_HOST).
bind 0.0.0.0
protected-mode yes

# --- memory: refuse writes instead of deleting state when full (alerts fire long before, see observability/)
maxmemory 256mb
maxmemory-policy noeviction

# --- durability: sessions survive a restart (AOF every second + RDB snapshots)
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 100

# --- background freeing: large DEL/expire never blocks the event loop
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# --- connections: detect dead peers (FPM persistent sockets, workers)
tcp-keepalive 60
timeout 0
maxclients 10000

# --- diagnostics (Admin → Redis Management)
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256

# --- dangerous commands off (the platform clears its cache with SCAN + UNLINK)
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
