# Yii3 Enterprise Platform — PRODUCTION nginx configuration (server + http-level directives).
# Author: ShokirjonMK — https://github.com/ShokirjonMK/Yii3-Enterprise-Platform
#
# Installed as /etc/nginx/conf.d/default.conf in the nginx-unprivileged image, i.e. it is included INSIDE http{}
# of the image's nginx.conf (non-root uid 101, pid and temp paths under /tmp). That is why it carries both the
# http-level hardening and the server block.
#
# PHP-FPM runs in the SAME pod (Kubernetes sidecar model) or the same network namespace (compose staging:
# `network_mode: service:app`) and is reached on 127.0.0.1:9000.
#
# Trusted load-balancer / ingress CIDRs for X-Forwarded-For are in /etc/nginx/snippets/real-ip.conf and can be
# overridden per environment by mounting a ConfigMap over that single file.
#
# Security headers: PHP responses already carry CSP/HSTS/XFO/... from SecurityHeadersMiddleware, so nginx adds
# headers ONLY to responses it serves itself (static files, errors) — no duplicated headers.

server_tokens off;

log_format platform_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for","request_id":"$corr_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","ua":"$http_user_agent","host":"$host"}';

# Correlation id: keep the client/ingress X-Request-Id when present, otherwise use the nginx request id.
map $http_x_request_id $corr_id {
    default $http_x_request_id;
    ""      $request_id;
}

# TLS is terminated at the ingress/LB. The app derives the URI scheme from $_SERVER['HTTPS'] (secure session
# cookies require https), so translate X-Forwarded-Proto into the FastCGI HTTPS param. This is safe because the
# pod only accepts traffic from the ingress controller (NetworkPolicy), which overwrites X-Forwarded-Proto.
map $http_x_forwarded_proto $fwd_https {
    default "";
    https   on;
}

# (sendfile / keepalive_timeout are already set by the image's nginx.conf; overridden per server below)
tcp_nopush on;
keepalive_requests 1000;
client_max_body_size 32m;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 30s;
large_client_header_buffers 4 16k;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# Edge rate limiting per real client IP (application-level limits are stricter and per identity).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
limit_req_status 429;

server {
    listen 8080 default_server;
    server_name _;
    root /app/public;
    index index.php;

    access_log /dev/stdout platform_json;
    error_log /dev/stderr warn;
    # Shorter than typical LB idle timeouts would cause 502s; keep it above the ingress upstream keepalive (60s).
    keepalive_timeout 75s;

    include /etc/nginx/snippets/real-ip.conf;

    # nginx-only probe (does not touch PHP) — container liveness.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Prometheus endpoint: still Bearer-protected by the app; additionally only reachable from private networks
    # (remote_addr is the REAL client ip after real_ip processing, so internet clients behind the LB are denied).
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /health/ {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    # Never serve dotfiles or source-like files from public/
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|ini|log|sh|sql|bak|dist|lock|yml|yaml|php~)$ { deny all; }

    # Pre-published, content-hashed assets (immutable) and static files.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /static/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(login|auth)/ {
        limit_req zone=auth burst=20 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        internal;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $corr_id;
        fastcgi_param HTTPS $fwd_https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }

    # Errors served by nginx itself get the baseline headers too.
    error_page 404 /static/404-fallback;
    location = /static/404-fallback {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        default_type text/plain;
        return 404 "Not found";
    }
}
