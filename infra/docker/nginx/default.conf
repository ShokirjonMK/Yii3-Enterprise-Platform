# Docker DNS: re-resolve the PHP-FPM service so recreated containers (new IPs) are picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;

    # Request correlation: pass nginx request id to PHP unless the client already sent one
    set $corr_id $http_x_request_id;
    if ($corr_id = "") {
        set $corr_id $request_id;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Never serve dotfiles or source-like files from public/
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|ini|log|sh|sql|bak|dist|lock|yml|yaml)$ { deny all; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(login|auth)/ {
        limit_req zone=auth burst=20 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $corr_id;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 65s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }
}
