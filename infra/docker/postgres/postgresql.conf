# PostgreSQL 17 — local development configuration.
# Production values are in infra/kubernetes/postgres (CloudNativePG cluster spec).
listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# WAL / PITR (archiving to a local volume in dev; object storage in prod)
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/data/wal-archive/%f && cp %p /var/lib/postgresql/data/wal-archive/%f'
archive_timeout = 300
hot_standby = on

# Observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000
track_io_timing = on
log_min_duration_statement = 500
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1000
log_line_prefix = '%m [%p] %q%u@%d '

timezone = 'UTC'
password_encryption = scram-sha-256
