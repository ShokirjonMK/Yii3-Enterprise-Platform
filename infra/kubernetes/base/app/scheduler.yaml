# Cron scheduler. Two replicas for availability: leader election is built in (PostgreSQL advisory lock +
# unique tick row), so exactly one replica enqueues each tick; the standby takes over within one tick (~15 s).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/name: yii3-platform
    app.kubernetes.io/component: scheduler
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    # Replace one replica at a time (required anti-affinity would block a surge pod on a 2-node pool;
    # the remaining replica keeps/takes the leader lock).
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: yii3-platform
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yii3-platform
        app.kubernetes.io/component: scheduler
        tier: app
    spec:
      serviceAccountName: platform-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          # Never co-locate both replicas: a single node loss must not stop scheduling.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: yii3-platform, app.kubernetes.io/component: scheduler }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: yii3-platform, app.kubernetes.io/component: scheduler }
      containers:
        - name: scheduler
          image: yep-php
          imagePullPolicy: IfNotPresent
          command: ["php", "yii", "scheduler:run", "--daemon"]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-db-app, key: password } }
            - name: KAFKA_SASL_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-app, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # The daemon exits on fatal errors (container restarts). There is no per-process heartbeat for the scheduler,
          # so liveness only checks that the PHP runtime + application config still boot a console command
          # (catches a wedged/OOM-thrashing container, not a stuck loop — see "SchedulerStalled" in the runbook).
          livenessProbe:
            exec: { command: ["php", "yii", "list", "--raw", "scheduler"] }
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 2"] }
          volumeMounts:
            - { name: runtime, mountPath: /app/runtime }
            - { name: tmp, mountPath: /tmp }
            - { name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true }
      volumes:
        - name: runtime
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: kafka-ca
          secret:
            secretName: platform-kafka-cluster-ca-cert
            items: [{ key: ca.crt, path: ca.crt }]
