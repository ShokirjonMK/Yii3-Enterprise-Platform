# Queue workers (PostgreSQL SKIP LOCKED queue). Scaled by KEDA on queue depth (app/keda-worker.yaml).
#
# queue:work recycles itself after --max-jobs / --memory. A tiny supervisor loop restarts it in-process so the
# kubelet's CrashLoopBackOff never kicks in for normal recycling, while SIGTERM is forwarded and the current
# job is allowed to finish (graceful shutdown is implemented in App\Platform\Queue\Worker).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: yii3-platform
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: yii3-platform
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yii3-platform
        app.kubernetes.io/component: worker
        tier: app
    spec:
      serviceAccountName: platform-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Must exceed the longest job timeout you allow on the queues drained by this deployment.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: yii3-platform, app.kubernetes.io/component: worker }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: yii3-platform, app.kubernetes.io/component: worker }
      containers:
        - name: worker
          image: yep-php
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              child=0
              trap 'kill -TERM "$child" 2>/dev/null; wait "$child"; exit 0' TERM INT
              while :; do
                php yii queue:work --queue="${WORKER_QUEUES}" --sleep=1 --max-jobs=1000 --memory=256 &
                child=$!
                wait "$child"
              done
          env:
            - name: WORKER_QUEUES
              value: default,notifications,integrations
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-db-app, key: password } }
            - name: KAFKA_SASL_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-app, key: password } }
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          # worker:health succeeds when a worker registered under this pod's hostname heartbeated < 90 s ago.
          startupProbe:
            exec: { command: ["php", "yii", "worker:health", "--type=queue"] }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            exec: { command: ["php", "yii", "worker:health", "--type=queue"] }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the in-flight job a head start before SIGTERM; the trap above forwards SIGTERM to queue:work.
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
          volumeMounts:
            - { name: runtime, mountPath: /app/runtime }
            - { name: tmp, mountPath: /tmp }
            - { name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true }
      volumes:
        - name: runtime
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: kafka-ca
          secret:
            secretName: platform-kafka-cluster-ca-cert
            items: [{ key: ca.crt, path: ca.crt }]
