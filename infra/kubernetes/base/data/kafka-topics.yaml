# KafkaTopic CRs for every topic in App\Platform\Setup\PlatformSeeder::TOPICS (generated from that list; keep in sync).
# The Topic Operator owns topic creation in Kubernetes (auto.create.topics.enable=false); `php yii kafka:provision`
# is only used for docker-compose / bare-metal. Replicas 3 + min.insync.replicas 2 everywhere.
---
# Security-relevant audit events
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: platform-audit
  labels:
    strimzi.io/cluster: platform-kafka
spec:
  topicName: platform.audit
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 2592000000
    cleanup.policy: delete
    compression.type: producer
---
