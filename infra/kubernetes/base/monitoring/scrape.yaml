# prometheus-operator scrape definitions. The Prometheus instance must select these objects (label
# "prometheus: platform" here; adjust to your serviceMonitorSelector / podMonitorSelector / scrapeConfigSelector).
#
# Application /metrics: counters and histograms are aggregated in Redis across ALL php processes and pods, so every
# pod returns the same cluster-wide view. Scraping each pod would multiply the series; therefore the app is scraped
# ONCE through the web Service ClusterIP (kubernetes SD role "service") — job="platform-app".
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: platform-app
  labels:
    prometheus: platform
spec:
  jobName: platform-app
  scrapeInterval: 30s
  scrapeTimeout: 10s
  metricsPath: /metrics
  scheme: HTTP
  authorization:
    type: Bearer
    credentials:
      name: platform-metrics-token
      key: token
  kubernetesSDConfigs:
    - role: Service
      namespaces:
        ownNamespace: true
  relabelings:
    - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component, __meta_kubernetes_service_port_name]
      regex: web;http
      action: keep
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - targetLabel: instance
      replacement: platform-web
---
# CloudNativePG instances (built-in exporter on :9187, port name "metrics")
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: platform-pg
  labels:
    prometheus: platform
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: platform-pg
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# Redis data nodes (redis_exporter sidecar :9121)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis
  labels:
    prometheus: platform
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: server }
  endpoints:
    - port: metrics
      interval: 30s
---
# Strimzi brokers/controllers (JMX exporter :9404, port "tcp-prometheus") and the Kafka Exporter (consumer lag)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: platform-kafka
  labels:
    prometheus: platform
spec:
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [Kafka, KafkaExporter]
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
