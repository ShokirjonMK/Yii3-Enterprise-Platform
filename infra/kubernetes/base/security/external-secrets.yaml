# Secrets are pulled from the organisation's secret manager (Vault / AWS SM / GCP SM / Azure KV ...) by the
# external-secrets.io operator. Nothing secret is stored in git. Remote keys follow
#   <env>/platform/<name>   (the overlay patches the store name and the key prefix).
# A plain Secret template for clusters without ESO is in infra/kubernetes/examples/secrets.example.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secret-store
  target:
    name: platform-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  # The remote secret is a JSON object whose properties are the env names:
  #   APP_SECRET, METRICS_TOKEN, REDIS_PASSWORD, S3_KEY, S3_SECRET, MAILER_DSN, TELEGRAM_BOT_TOKEN
  dataFrom:
    - extract:
        key: prod/platform/app-env
---
# Application database owner, consumed by CloudNativePG bootstrap (initdb.secret) and by the app (DB_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secret-store
  target:
    name: platform-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: platform
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: prod/platform/postgres, property: app_password }
---
# Credentials of the backup bucket (CNPG barman WAL archive + base backups). Separate, write-only-to-prefix identity.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secret-store
  target:
    name: platform-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: prod/platform/s3-backup, property: access_key }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: prod/platform/s3-backup, property: secret_key }
---
# Bearer token Prometheus uses to scrape /metrics (same value as METRICS_TOKEN). Lives in the platform namespace;
# the ScrapeConfig references it (prometheus-operator reads secrets from the ScrapeConfig's namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-metrics-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secret-store
  target:
    name: platform-metrics-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: prod/platform/app-env, property: METRICS_TOKEN }
