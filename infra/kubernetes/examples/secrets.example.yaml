# TEMPLATE ONLY — for clusters without external-secrets.io. NOT part of any kustomization.
# Never commit real values. Create the secrets out-of-band, e.g.:
#
#   kubectl -n platform-prod create secret generic platform-secrets \
#     --from-literal=APP_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=METRICS_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=S3_KEY=... --from-literal=S3_SECRET=... \
#     --from-literal=MAILER_DSN='smtp://user:pass@smtp.example.com:587' \
#     --from-literal=TELEGRAM_BOT_TOKEN=
#
# and remove security/external-secrets.yaml from the overlay (patch `$patch: delete`).
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
type: Opaque
stringData:
  APP_SECRET: "<64 hex chars: openssl rand -hex 32>"
  METRICS_TOKEN: "<openssl rand -hex 32>"
  REDIS_PASSWORD: "<openssl rand -hex 32>"
  S3_KEY: "<access key of the app identity (files bucket)>"
  S3_SECRET: "<secret key>"
  MAILER_DSN: "smtp://<user>:<password>@<smtp-host>:587"
  TELEGRAM_BOT_TOKEN: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-db-app
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: platform
  password: "<strong random password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-backup-s3
type: Opaque
stringData:
  ACCESS_KEY_ID: "<access key of the backup identity (backups bucket)>"
  ACCESS_SECRET_KEY: "<secret key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-metrics-token
type: Opaque
stringData:
  token: "<same value as METRICS_TOKEN>"
