# Yii3 Enterprise Platform — Ansible configuration for bare-metal / VM Docker hosts (compose-based STAGING).
# Docker Compose is single-host and NOT highly available; production runs on Kubernetes (infra/kubernetes).
[defaults]
inventory = inventories/staging/hosts.yml
roles_path = roles
collections_path = ./collections:~/.ansible/collections
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
forks = 10
# Vault password is never stored in the repository: export ANSIBLE_VAULT_PASSWORD_FILE=~/.yep-vault-pass
# (or pass --ask-vault-pass / a CI masked variable written to a temp file).

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
